openapi: 3.0.3
info:
  title: Loose API
  version: "1.0"
paths:
  /things:
    get:
      responses:
        "200":
          description: Every thing.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thing" }
components:
  schemas:
    Thing:
      type: object
      properties:
        owner:
          nullable: true
